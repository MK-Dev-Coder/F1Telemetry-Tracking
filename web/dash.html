<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>Race Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* The second screen: your race in big numbers, for a phone or tablet next to the TV while you drive (F1 25 and F1 26). */
:root{
  color-scheme: dark;
  --bg:#0a0d12; --tile:#141a23; --line:#232c39; --fg:#eef2f7; --muted:#93a0b2; --dim:#5b6676;
  --purple:#c77dff; --green:#22d36b; --yellow:#ffd60a; --red:#ff5a66; --blue:#5ec8ff; --amber:#ffb020;
  --soft:#ff4d5e; --medium:#ffd60a; --hard:#eef1f5; --inter:#3bc46e; --wet:#2f7bff;
  --f-ui:"Titillium Web", "Segoe UI", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:10px}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top b{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.top span{color:var(--muted);font-size:14px}
.flag{margin-left:auto;padding:4px 12px;border-radius:999px;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:#173a26;color:#7cf2a6}
.flag.sc{background:var(--yellow);color:#1a1300} .flag.vsc{background:#3a2c05;color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.btns{display:flex;gap:6px}
.btns button{border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}
.t{background:var(--tile);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line)}
.t small{font-size:clamp(12px,1.6vw,15px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-num);font-weight:700;font-size:clamp(34px,8vw,92px);line-height:1;letter-spacing:-.02em;white-space:nowrap}
.mid{font-family:var(--f-num);font-weight:600;font-size:clamp(24px,5vw,56px);line-height:1;white-space:nowrap}
.sub{font-size:clamp(13px,1.8vw,18px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--fg)}
.p{color:var(--purple)} .g{color:var(--green)} .y{color:var(--yellow)} .r{color:var(--red)}
.pos .big{font-size:clamp(44px,11vw,130px)}
.gaps{display:grid;grid-template-rows:1fr 1fr;gap:8px}
.gaps > div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tyres{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.ring{width:clamp(40px,7vw,70px);height:clamp(40px,7vw,70px);border-radius:50%;border:clamp(4px,.8vw,7px) solid var(--c);display:grid;place-items:center;font-weight:900;font-size:clamp(16px,3vw,28px)}
.wear{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wear span{border-radius:8px;padding:4px 0;text-align:center;font-family:var(--f-num);font-weight:700;font-size:clamp(14px,2.6vw,26px);background:#1d2430}
.bar{height:12px;border-radius:6px;background:#232b37;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.radio{flex-direction:row;align-items:center;gap:14px;justify-content:flex-start;padding:10px 16px}
.radio b{font-size:clamp(16px,2.6vw,26px);font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio .dot{width:14px;height:14px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 0 6px rgba(255,90,102,.18)}
.wait{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:18px;line-height:1.5;padding:20px}
.wait b{display:block;color:var(--fg);font-size:28px;font-weight:900;margin-bottom:8px}
.wait code{font-family:var(--f-num);background:#1d2430;border-radius:6px;padding:2px 8px;color:#fff}
@media (orientation:portrait), (max-width:700px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} .pos{grid-column:1 / -1} }
@media (max-height:420px){ .t{padding:8px 12px} .grid{gap:6px} }
</style>
</head>
<body>
<header class="top">
  <b id="game">Race dash</b><span id="where">Waiting for the game…</span>
  <span class="flag" id="flag" hidden></span>
  <span class="btns"><button type="button" id="awake" hidden>Keep the screen on</button><button type="button" id="full">Full screen</button></span>
</header>
<div class="wait" id="wait"><div><b>Waiting for the game</b>Start a session in F1 25 (or F1 26) and this page fills in by itself.<br><span id="waitNote"></span></div></div>
<main class="grid" id="dash" hidden aria-live="off">
  <section class="t pos"><small>Position</small><span class="big" id="pos">–</span><span class="sub" id="posSub"></span></section>
  <section class="t"><small id="gapsLabel">Gaps</small><div class="gaps"><div><span class="sub" id="aheadWho">Ahead</span><span class="mid" id="ahead">–</span></div><div><span class="sub" id="behindWho">Behind</span><span class="mid" id="behind">–</span></div></div></section>
  <section class="t"><small>Last lap</small><span class="mid" id="last">–</span><span class="sub" id="best"></span></section>
  <section class="t"><small>Tyres</small><div class="tyres"><span class="ring" id="ring">–</span><div class="wear" id="wear"></div></div><span class="sub" id="tyreSub"></span></section>
  <section class="t"><small>Fuel</small><span class="mid" id="fuel">–</span><span class="sub" id="fuelSub"></span></section>
  <section class="t"><small id="ersLabel">ERS battery</small><span class="mid" id="ers">–</span><div class="bar"><i id="ersBar"></i></div><span class="sub" id="ersSub"></span></section>
</main>
<footer class="t radio" id="radioTile" hidden aria-live="polite"><span class="dot" aria-hidden="true"></span><b id="radio"></b></footer>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const TY = { SOFT: ["S", "var(--soft)"], MEDIUM: ["M", "var(--medium)"], HARD: ["H", "var(--hard)"], INTERMEDIATE: ["I", "var(--inter)"],
  WET: ["W", "var(--wet)"], UNKNOWN: ["?", "var(--dim)"] };
const lapTime = s => s == null ? "–" : `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, "0")}`;
const gap = s => s == null ? "–" : `+${s.toFixed(s < 10 ? 3 : 1)}`;
const wearCol = w => w == null ? "" : w >= 70 ? "r" : w >= 45 ? "y" : "g";
const set = (id, text, cls) => { const el = $(id); el.textContent = text; if (cls !== undefined) el.className = el.className.replace(/\b[pgyr]\b/g, "").trim() + (cls ? " " + cls : ""); };

function show(d) {
  const i = d.info || {}, rows = d.leaderboard || [], k = rows.findIndex(r => r.player), me = rows[k], c = d.car || {};
  $("wait").hidden = true; $("dash").hidden = false;
  $("game").textContent = d.session?.game || "F1 25";
  $("where").textContent = `${i.track || ""} · ${i.session_type || ""}${me ? ` · Lap ${me.lap}${d.race && i.total_laps ? " / " + i.total_laps : ""}` : ""}`;
  const f = { "SAFETY CAR": ["Safety car", "sc"], VSC: ["Virtual safety car", "vsc"], "FORMATION LAP": ["Formation lap", "vsc"] }[i.safety_car];
  $("flag").hidden = !d.race; $("flag").textContent = f ? f[0] : "Green"; $("flag").className = "flag" + (f ? " " + f[1] : "");
  if (!me) return;
  set("pos", `P${me.position || "–"}`); $("posSub").innerHTML = `of <b>${rows.length}</b>${me.pit_stops ? ` · <b>${me.pit_stops}</b> stop${me.pit_stops > 1 ? "s" : ""}` : ""}${me.status === "PIT" ? " · <b>in the pits</b>" : ""}`;
  if (d.race) {                                         // the cars just ahead and behind on the road
    const a = rows[k - 1], b = rows[k + 1];
    $("gapsLabel").textContent = "Gaps";
    $("aheadWho").textContent = a ? `Ahead · ${a.driver}` : "Ahead"; set("ahead", a ? gap(me.interval) : "Leader");
    $("behindWho").textContent = b ? `Behind · ${b.driver}` : "Behind"; set("behind", b ? gap(b.interval) : "–");
  } else {                                              // practice and qualifying: against the fastest lap
    $("gapsLabel").textContent = "Best laps";
    $("aheadWho").textContent = k ? `To P1 · ${rows[0].driver}` : "You're P1"; set("ahead", k ? gap(me.gap) : "–");
    $("behindWho").textContent = "Your best"; set("behind", lapTime(me.best_lap));
  }
  set("last", lapTime(me.last_lap), { p: "p", g: "g" }[me.last_col] || "");
  $("best").innerHTML = `Best <b>${lapTime(me.best_lap)}</b>${me.invalid_now ? ' · <b class="r">this lap invalid</b>' : ""}`;
  const [l, col] = TY[c.compound] || TY.UNKNOWN, w = c.wear || [];
  $("ring").textContent = l; $("ring").style.setProperty("--c", col);
  $("wear").innerHTML = [2, 3, 0, 1].map(j => `<span class="${wearCol(w[j])}" title="${["Rear left", "Rear right", "Front left", "Front right"][j]}">${w[j] != null ? Math.round(w[j]) + "%" : "–"}</span>`).join("");
  $("tyreSub").innerHTML = `<b>${c.tyre_age ?? "–"}</b> laps old${c.actual_compound ? ` · ${c.actual_compound}` : ""}`;
  // Fuel against the laps to go (a race): + means a little to spare
  const toGo = d.race && i.total_laps ? Math.max(0, i.total_laps - me.lap + 1 - Math.min(1, (me.lap_distance || 0) / (i.track_length || 1e9))) : null;
  const spare = c.fuel_laps != null && toGo != null ? c.fuel_laps - toGo : null;
  set("fuel", spare != null ? `${spare >= 0 ? "+" : "−"}${Math.abs(spare).toFixed(1)}` : c.fuel_laps != null ? c.fuel_laps.toFixed(1) : "–", spare == null ? "" : spare < 0 ? "r" : spare < 0.3 ? "y" : "g");
  $("fuelSub").innerHTML = spare != null ? `laps to spare · <b>${c.fuel?.toFixed(1) ?? "–"} kg</b> in the tank` : `laps of fuel · <b>${c.fuel?.toFixed(1) ?? "–"} kg</b>`;
  // F1 26: the energy harvested this lap against the most the rules allow, and overtake mode; F1 25: the battery
  const battery = c.ers != null ? Math.min(100, c.ers / 4e6 * 100) : null, m = c.modes;
  if (c.ers_limit) {
    const share = Math.min(100, (c.ers_harvested || 0) / c.ers_limit * 100);
    $("ersLabel").textContent = "Energy this lap"; set("ers", `${Math.round(share)}%`); $("ersBar").style.width = share + "%";
    $("ersSub").innerHTML = `of the limit harvested · battery <b>${battery == null ? "–" : Math.round(battery) + "%"}</b>` +
      (m ? ` · overtake <b>${m.overtake_active ? "ON" : m.overtake_available ? "ready" : "–"}</b>` : "");
  } else {
    $("ersLabel").textContent = "ERS battery"; set("ers", battery == null ? "–" : `${Math.round(battery)}%`); $("ersBar").style.width = (battery || 0) + "%";
    $("ersSub").innerHTML = c.ers_mode != null ? `mode <b>${{ 0: "none", 1: "medium", 2: "hotlap", 3: "overtake" }[c.ers_mode] || "–"}</b>` : "";
  }
  const call = (d.radio || []).at(-1);
  $("radioTile").hidden = !call; if (call) $("radio").textContent = call.text;
}

function waiting(status) {
  $("wait").hidden = false; $("dash").hidden = true; $("flag").hidden = true; $("radioTile").hidden = true;
  $("where").textContent = "Waiting for the game…";
  $("waitNote").innerHTML = status && status.packets ? `The app has had ${status.packets} packets, but no session is live right now.`
    : "In the game: Settings → Telemetry Settings, UDP Telemetry On.";
}

let es;
function listen() {
  es = new EventSource("/game/live");
  es.onmessage = e => { const d = JSON.parse(e.data); if (d.live && d.session) show(d); else waiting(d.status); };
  es.onerror = () => { $("where").textContent = "Lost the app: is it still running? Trying again…"; };
}
listen();

// Keep the screen on (the browser allows it on the PC, or over https); else set the phone's screen to stay on
let lock = null;
if ("wakeLock" in navigator && window.isSecureContext) {
  $("awake").hidden = false;
  $("awake").onclick = async () => { try { lock = lock ? (await lock.release(), null) : await navigator.wakeLock.request("screen");
    $("awake").textContent = lock ? "Screen stays on" : "Keep the screen on"; } catch (err) { $("awake").textContent = "Can't keep it on"; } };
  document.addEventListener("visibilitychange", async () => { if (lock && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen").catch(() => null); });
}
$("full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
})();
</script>
</body>
</html>
