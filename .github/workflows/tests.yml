# Runs the tests on every push: the ones that need no data folder (the data is Formula 1's and isn't in the
# repository, so the tests that read it are skipped, as the README says).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests -q
